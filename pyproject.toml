[project]
name = "aiven-runtime-containerizer"
version = "0.1.0"
description = "Convert docker-compose `image:` references into local Dockerfiles for Aiven Apps."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jay Miller", email = "jay.miller@aiven.io" }]
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
]

[project.scripts]
dockerize-images = "aiven_runtime_containerizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiven_runtime_containerizer"]
