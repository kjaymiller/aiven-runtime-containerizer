[project]
name = "aiven-runtime-containerizer"
dynamic = ["version"]
description = "Convert docker-compose `image:` references into local Dockerfiles for Aiven Apps."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jay Miller", email = "jay.miller@aiven.io" }]
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
]

[project.scripts]
dockerize-images = "aiven_runtime_containerizer.cli:main"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
