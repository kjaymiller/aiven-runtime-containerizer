# ILLUSTRATIVE ONLY -- hand-written, not generated by actually running
# the tool. Unlike the other examples' docker-compose.after.yaml files,
# this one needs a real AIVEN_TOKEN and real `my-production-pg`/`kafka`
# services in the target project to produce for real -- see
# ../README.md for exactly what's verified vs. not.
#
# This shows the *shape* of the output: db's x-aiven-service override
# resolves to my-production-pg; queue binds by convention to whichever
# single kafka service exists in the project. Neither gets a Dockerfile
# -- Aiven runs both natively -- but each gets real connection details
# in its environment: block. The password is always a reference the
# container resolves itself, never a value this tool fetched or wrote.
services:
  web:
    image: myorg/web:3.0.0
    depends_on:
      - db
      - queue

  db:
    image: postgres:16
    x-aiven-service: my-production-pg
    environment:
      AIVEN_DB_HOST: my-production-pg-jay-miller.aivencloud.com
      AIVEN_DB_PORT: "12691"
      AIVEN_DB_SSL: "true"
      AIVEN_DB_USER: avnadmin
      AIVEN_DB_DBNAME: defaultdb
      AIVEN_DB_PASSWORD: ${AIVEN_DB_PASSWORD}

  queue:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      AIVEN_QUEUE_HOST: my-kafka-jay-miller.aivencloud.com
      AIVEN_QUEUE_PORT: "26279"
      AIVEN_QUEUE_SSL: "true"
      AIVEN_QUEUE_PASSWORD: ${AIVEN_QUEUE_PASSWORD}
