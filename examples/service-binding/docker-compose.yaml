# `db` names a real Aiven pg service explicitly via `x-aiven-service:`
# (compose ignores unknown `x-*` keys, so this is safe alongside a normal
# `docker compose up` too). `queue` has no override, so it'll bind by
# convention -- the one `kafka` service in the project, if there's
# exactly one.
#
# Needs a real AIVEN_TOKEN and an Aiven project with these services --
# see ../README.md for what to expect without running it for real.
#
#   dockerize-images docker-compose.yaml --project jay-miller \
#     -o docker-compose.after.yaml
services:
  web:
    image: myorg/web:3.0.0
    depends_on:
      - db
      - queue

  db:
    image: postgres:16
    x-aiven-service: my-production-pg

  queue:
    image: confluentinc/cp-kafka:7.6.0
