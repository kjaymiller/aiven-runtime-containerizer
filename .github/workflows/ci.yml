name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Format check + lint + unit tests (`-m "not e2e"`). No Aiven
      # credentials needed or available here -- see e2e.yml for that.
      - run: mise run check
